<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Charly MD V2 - Pairing Panel</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dff5f2, #c8ebe6);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 20px;
      width: 95%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1abc9c;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #16a085;
    }

    .warning {
      font-size: 12px;
      color: #e67e22;
      margin-bottom: 15px;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style></head>
<body>  <div class="card">
    <div class="title">Charly MD V2</div>
    <div class="subtitle">WhatsApp Bot Pairing Panel</div><input type="text" id="phone" placeholder="260XXXXXXXXX" />

<div class="warning">
  ⚠ Enter full number with country code. No + or spaces.
</div>

<button onclick="getCode()">Get Pair Code</button>

<div class="result" id="result"></div>
<div class="error" id="error"></div>

<div class="footer">
  Powered by SAT Limited
  Made by Simbarashe Tembo .A.
</div>

  </div>  <script>
    async function getCode() {
      const phone = document.getElementById("phone").value.trim();
      const result = document.getElementById("result");
      const error = document.getElementById("error");

      result.innerText = "";
      error.innerText = "";

      if (!phone) {
        error.innerText = "Enter a phone number.";
        return;
      }

      try {
        const res = await fetch("/api/pair-code", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ phone })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Failed to get code");
        }

        result.innerText = "Your Code: " + data.code;
      } catch (err) {
        console.error(err);

        if (err.message.includes("Unexpected token")) {
          error.innerText = "Server returned HTML instead of JSON. Check backend route.";
        } else {
          error.innerText = err.message;
        }
      }
    }
  </script></body>
</html>
