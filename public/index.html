<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Charly MD V2 - Pairing Panel</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Segoe UI',sans-serif;
    }

    body{
      background:linear-gradient(135deg,#dff5f2,#c8ebe6);
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      padding:15px;
    }

    .card{
      background:#fff;
      padding:25px;
      border-radius:20px;
      width:100%;
      max-width:400px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
      text-align:center;
    }

    .title{
      font-size:24px;
      font-weight:bold;
      margin-bottom:5px;
    }

    .subtitle{
      color:#666;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid #ddd;
      margin-bottom:10px;
      font-size:16px;
      outline:none;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#1abc9c;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
      font-weight:bold;
    }

    button:hover{
      background:#16a085;
    }

    button:disabled{
      opacity:0.7;
      cursor:not-allowed;
    }

    .warning{
      font-size:12px;
      color:#e67e22;
      margin-bottom:15px;
    }

    .result{
      margin-top:15px;
      font-weight:bold;
      font-size:18px;
      white-space:pre-line;
      color:#16a085;
    }

    .error{
      color:red;
      margin-top:10px;
      white-space:pre-line;
    }

    .footer{
      margin-top:20px;
      font-size:12px;
      color:#888;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="title">Charly MD V2</div>

  <div class="subtitle">
    WhatsApp Bot Pairing Panel
  </div>

  <input
    type="text"
    id="phone"
    placeholder="260XXXXXXXXX"
  />

  <div class="warning">
    ⚠ Enter full number with country code.<br>
    No +, spaces, or symbols.
  </div>

  <button id="pairBtn" onclick="getCode()">
    Get Pair Code
  </button>

  <div class="result" id="result"></div>
  <div class="error" id="error"></div>

  <div class="footer">
    Powered by SAT Limited<br>
    Made by Simbarashe Tembo .A.
  </div>

</div>

<script>

async function getCode() {

  const phone =
    document.getElementById("phone").value.trim()

  const result =
    document.getElementById("result")

  const error =
    document.getElementById("error")

  const btn =
    document.getElementById("pairBtn")

  result.innerText = ""
  error.innerText = ""

  // Basic validation
  if (!phone) {
    error.innerText =
      "❌ Enter phone number."
    return
  }

  if (!/^[0-9]+$/.test(phone)) {
    error.innerText =
      "❌ Numbers only."
    return
  }

  if (phone.length < 10) {
    error.innerText =
      "❌ Invalid phone number."
    return
  }

  btn.disabled = true
  btn.innerText = "Generating..."

  result.innerText =
    "⏳ Generating pair code..."

  try {

    const res = await fetch("/api/pair-code", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ phone })
    })

    const data = await res.json()

    if (!res.ok) {
      throw new Error(
        data.error || "Failed to generate code"
      )
    }

    result.innerText =
`✅ Pair Code:

${data.code}

📱 Open WhatsApp
→ Linked Devices
→ Link with phone number`

  } catch (err) {

    console.error(err)

    result.innerText = ""

    if (err.message.includes("Unexpected token")) {

      error.innerText =
        "❌ Backend returned HTML instead of JSON.\nCheck Render logs."

    } else {

      error.innerText =
        "❌ " + err.message
    }

  } finally {

    btn.disabled = false
    btn.innerText = "Get Pair Code"
  }
}

</script>

</body>
</html>
